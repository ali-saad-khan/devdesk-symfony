name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: devdesk
          POSTGRES_PASSWORD: devdesk
          POSTGRES_DB: devdesk
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U devdesk" --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      APP_ENV: test
      DATABASE_URL: postgresql://devdesk:devdesk@127.0.0.1:5432/devdesk?serverVersion=16&charset=utf8
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: intl, pdo_pgsql, zip
          coverage: none
          tools: composer:v2

      - name: Cache Composer
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache
          key: composer-${{ hashFiles('composer.lock') }}

      - run: composer install --no-interaction --prefer-dist --no-progress
      - run: composer audit
      - run: composer validate --strict
      - run: vendor/bin/php-cs-fixer fix --dry-run --diff
      - run: php bin/console lint:container
      - run: php bin/console lint:twig templates
      - run: php bin/console lint:yaml config
      - name: Warm dev cache for PHPStan
        run: APP_ENV=dev php bin/console cache:warmup
      - run: vendor/bin/phpstan analyse --no-progress
      - name: Prepare test database
        run: |
          php bin/console doctrine:database:create --if-not-exists
          php bin/console doctrine:migrations:migrate --no-interaction
          php bin/console doctrine:schema:validate
      - run: php bin/phpunit

  docker:
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.prod
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
